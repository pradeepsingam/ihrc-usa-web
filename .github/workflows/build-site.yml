# Builds the public website on every push to main and publishes the finished files to the
# "site-build" branch. The server (scripts/server-deploy.sh, run by cron every 5 minutes)
# downloads that branch and copies it into the web root. The build runs here because the
# hosting account has no room for node_modules (file-count limit).
name: Build website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build (pre-renders pages with the live admin content)
        run: npm run build
        env:
          VITE_API_URL: https://ihrc-usa.org

      - run: node scripts/check-seo.mjs

      - name: Publish to the site-build branch
        run: |
          test -s dist/index.html
          test -s dist/.htaccess
          echo "$GITHUB_SHA" > dist/.source-revision
          cd dist
          git init -q -b site-build
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website build of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
